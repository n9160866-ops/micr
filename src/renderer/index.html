<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>HW Panel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <h1>Monitoring Matériel</h1>
    <div id="error-banner" class="error-banner hidden"></div>

    <section class="card">
      <h2>Températures CPU (par core)</h2>
      <div id="cpu-cores" class="rows"></div>
    </section>

    <section class="card">
      <h2>Ventilateur CPU</h2>
      <div id="cpu-fans" class="rows"></div>
    </section>

    <section class="card">
      <h2>Température GPU</h2>
      <div id="gpu-temps" class="rows"></div>
    </section>

    <section class="card">
      <h2>Ventilateur GPU</h2>
      <div id="gpu-fans" class="rows"></div>
    </section>

    <section class="card">
      <h2>Ventilateurs boîtier</h2>
      <div id="case-fans" class="rows"></div>
    </section>

    <div id="status" class="status"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
